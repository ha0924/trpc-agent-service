# 平台配置示例
#
# 复制为 configs/config.yaml 后按本机情况修改。
# config.yaml 含明文凭据，已被 .gitignore 忽略，不要提交。
#
# 设计依据：docs/dev/代码组织方案.md §4「包结构」config 包
#           docs/技术设计方案.md §7.4「密钥和脱敏」

# Gateway 进程
gateway:
  addr: ":8080"
  # 副本标识，用于长连接的连接租约 owner 字段。留空则用 hostname+pid。
  # 同机跑两个副本时必须区分，否则会互相释放对方的租约、双双建连，
  # 而企业微信只允许同一 bot 保持一条有效连接。
  id: ""
  # 优雅停机等待时长：停止接收新请求后，等待在途请求完成的上限
  shutdown_timeout: 30s

# Worker 进程
worker:
  # 消费者标识，用于 Session 租约的 owner 字段。留空则用 hostname+pid
  id: ""
  # 同时处理的会话数上限
  concurrency: 8
  shutdown_timeout: 60s

# 配置库与业务库
mysql:
  dsn: "USER:PASSWORD@tcp(127.0.0.1:3306)/trpc_agent_platform?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

# 运行时状态：Session State、租约、信箱、队列
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

# Session 调度
scheduler:
  # 租约 TTL。它同时是 Worker 故障后的恢复时间上限：
  # 持有租约的 Worker 崩溃后，该会话被阻塞至多这么久。
  # 过短会导致长任务执行中途丢失租约，过长会拖慢故障恢复。
  lease_ttl: 30s
  # 续期间隔，必须显著小于 lease_ttl
  lease_renew_interval: 10s
  # 单条消息的最大重试次数，超过后移入死信并继续排空信箱，
  # 避免一条毒消息永久阻塞整个会话
  max_message_attempts: 3
  # 对账扫描：重投滞留在 processing 的请求。
  #
  # 它同时兜住两处刻意的设计选择——队列允许丢提示、失败的消息留在 processing
  # 而非原地重试。没有扫描，前者会静默丢消息，后者会让重试计数永不累加、
  # max_message_attempts 永不触发。
  #
  # sweep_age 必须不小于 lease_ttl，否则会重投 Worker 仍在处理的工作。
  sweep_interval: 1m
  sweep_age: 5m
  sweep_batch: 50

# Runtime 装配与缓存
runtime:
  # 缓存容量上限。已发布版本不可变，缓存不会失效，
  # 因此只需处理容量与空闲淘汰，无需失效逻辑。
  cache_size: 64
  # 空闲多久后释放 Runtime
  idle_ttl: 30m

# 存储路由：按 tenant + agent + data_type 选后端。
# 一期映射从本文件读取，二期改为读 backend_configs / backend_bindings 两张表，
# 届时只改 Provider 内部，StorageRouter 接口不变。
storage:
  backends:
    # 三类后端并存，取舍不同：
    #   redis     写延迟最低，重启即失（会话状态可从 session_events 重建）
    #   mysql     持久且可查询，写延迟高于 Redis
    #   inmemory  仅进程内，用于本地开发与不需要跨节点共享的场景
    - name: redis-main
      kind: redis
    - name: mysql-main
      kind: mysql
      # 必须是独立的库。框架自带的 Session schema 也有一张
      # session_events 表（带 app_name 列），与平台数据模型里同名但结构
      # 不同的那张会冲突，指向同一个库会让框架的 schema 校验直接失败。
      dsn_ref: "USER:PASSWORD@tcp(127.0.0.1:3306)/trpc_agent_sessions?charset=utf8mb4&parseTime=true&loc=Local"
    - name: memory-main
      kind: inmemory
  # 未匹配到具体规则时的默认后端
  defaults:
    session: redis-main
    # 长期记忆走 Redis：跨节点可见是硬要求，任意 Worker 都要能读到同一份
    # 记忆，因此不能用 inmemory（那只在单进程内可见）。
    memory: redis-main
  # 按租户与数据类型覆盖默认值。规则越具体优先级越高：
  # 租户+Agent+数据类型 > 租户+数据类型 > 默认值。
  #
  # 下面这条不是演示用的摆设：tenant-acme 的会话真的落在 MySQL 而
  # tenant-demo 落在 Redis，两者在同一个进程内并行工作，
  # 指标里也能按 backend 分别看到延迟差异。
  rules:
    - tenant_id: tenant-acme
      data_type: session
      backend: mysql-main
    # 同一个租户的记忆也落 MySQL。两条规则合起来证明路由是按
    # 「租户 × 数据类型」二维生效的，而不是只按租户或只按类型。
    - tenant_id: tenant-acme
      data_type: memory
      backend: mysql-main

# 模型凭据。
# 配置库中只存 secret:// 引用，此处是引用到实际值的解析表。
# 一期用环境变量兜底，二期接入 Secret Manager 后本节可删除。
secrets:
  resolver: env
  # secret:// 引用 → 环境变量名
  mapping:
    "secret://prod/tenant-demo/model/primary-api-key": DEEPSEEK_API_KEY
    "secret://prod/tenant-demo/channel/mock-token": MOCK_CHANNEL_TOKEN
    # 企业微信的凭据是一个 JSON 块，含 corp_id / secret / agent_id /
    # token / encoding_aes_key。整体存在密钥管理器里，库中只留引用。
    "secret://prod/tenant-demo/channel/wecom": WECOM_CREDENTIALS
    # 智能机器人长连接的凭据结构不同：只含 bot_id / secret，
    # 没有 token 与 encoding_aes_key——长连接明文传输，无需验签与解密。
    "secret://prod/tenant-test/channel/wecom-aibot": WECOM_AIBOT_CREDENTIALS
    "secret://prod/tenant-test/model/primary-api-key": TEST_API_KEY
    # 第二个租户，密钥各自独立——一个租户的密钥解析不到，
    # 只影响该租户，不会波及其他租户。
    "secret://prod/tenant-acme/model/primary-api-key": ACME_API_KEY
    "secret://prod/tenant-acme/channel/mock-token": ACME_CHANNEL_TOKEN

# 模型服务端点。DeepSeek 兼容 OpenAI 协议，走同一个 client。
models:
  - name: deepseek-chat
    base_url: "https://api.deepseek.com/v1"

log:
  level: info
  # text 便于本地阅读，json 便于采集
  format: text

# OpenTelemetry。
#
# enabled 只控制导出：即使为 false，W3C trace context 仍会随 SessionHint 穿过
# 队列，因此打开导出不会是这套传播逻辑第一次运行。
#
# 本机观察可用 scripts/otlp_receiver.py 顶一个最小接收器：
#   python3 scripts/otlp_receiver.py 4318
telemetry:
  enabled: false
  protocol: http                      # grpc 或 http
  endpoint: "127.0.0.1:4318"
  service_namespace: trpc-agent-platform
  service_version: "0.1.0"
